[package]
name = "letterbox"
version = "0.3.1"
edition = "2024"
rust-version = "1.92"
license = "MIT"
authors = ["Yongjin Park"]
description = "Mail in the terminal: IMAP and Outlook accounts, read as easily by an AI agent as by you"
repository = "https://github.com/YPARK/letterbox"
keywords = ["email", "imap", "outlook", "mcp", "tui"]
categories = ["command-line-utilities", "email"]

[dependencies]
age = "0.12.1"
anyhow = "1.0.104"
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "env"] }
getrandom = "0.3"
imap = { version = "3.0.0-alpha.15", default-features = false }
imap-proto = "0.16"
jiff = "0.2.38"
keyring = "4.2.0"
mail-parser = "0.11.9"
ratatui = "0.30"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "=0.0.2-alpha"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
toml = "1.1.8"
toml_edit = "0.25.17"
unicode-width = "0.2.2"
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
webpki-roots = "1.0.10"

[dev-dependencies]
tempfile = "3.27.0"
